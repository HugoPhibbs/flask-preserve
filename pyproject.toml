[build-system]
requires = ["hatchling >= 1.33"]
build-backend = "hatchling.build"

[project]
name = "flask-preserve"
version = "0.1.0"
description = "Cache and compress Flask responses."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hugo Phibbs" }]
dependencies = [
    "brotli>=1.2.1",
    "flask",
    "redis>=8.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flask_preserve"]
