name: Claude PR Review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  review:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read  
      pull-requests: write  
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review `git diff ${{ env.BASE }} ${{ env.HEAD }}` for obvious bugs, security issues
            and significant code quality problems. No nitpicks.
            PR NUMBER: ${{ github.event.pull_request.number }}
            If PR NUMBER is set, post findings with `gh pr comment ${{ github.event.pull_request.number }}`.
            Otherwise post them with
            `gh api repos/${{ github.repository }}/commits/${{ env.HEAD }}/comments -f body="..."`.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/commits/${{ env.HEAD }}/comments:*)"